name: Bluetooth and camera host checks
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/media-checks.yml
      - xnu/vermeer/vermeer_bt_h4.h
      - xnu/vermeer/vermeer_bt_identity.h
      - xnu/vermeer/vermeer_bt_observe.h
      - xnu/vermeer/vermeer_media_tlmm.h
      - xnu/vermeer/vermeer_media_probe.h
      - xnu/vermeer/vermeer_media_probe.c
      - xnu/vermeer/media/**
      - tools/media_inventory.py
      - tests/bt_h4_test.c
      - tests/bt_identity_test.c
      - tests/media_tlmm_test.c
      - tests/media_probe_test.c
      - tests/media_records_test.py
      - tools/media_records.py
      - tools/make_media_probe_hooks.py
      - tests/media_inventory_test.py
      - tests/run-media-tests.sh
      - tests/camera_cci_test.c
      - tests/bt_uart_gpi_test.c
      - tests/bt_uart_service_test.c
      - tests/run-camera-bluetooth-functional-tests.sh
  pull_request:
    paths:
      - .github/workflows/media-checks.yml
      - xnu/vermeer/vermeer_bt_h4.h
      - xnu/vermeer/vermeer_bt_identity.h
      - xnu/vermeer/vermeer_bt_observe.h
      - xnu/vermeer/vermeer_media_tlmm.h
      - xnu/vermeer/vermeer_media_probe.h
      - xnu/vermeer/vermeer_media_probe.c
      - xnu/vermeer/media/**
      - tools/media_inventory.py
      - tests/bt_h4_test.c
      - tests/bt_identity_test.c
      - tests/media_tlmm_test.c
      - tests/media_probe_test.c
      - tests/media_records_test.py
      - tools/media_records.py
      - tools/make_media_probe_hooks.py
      - tests/media_inventory_test.py
      - tests/run-media-tests.sh
      - tests/camera_cci_test.c
      - tests/bt_uart_gpi_test.c
      - tests/bt_uart_service_test.c
      - tests/run-camera-bluetooth-functional-tests.sh
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/run-media-tests.sh
      - run: CC=clang sh tests/run-camera-bluetooth-functional-tests.sh
